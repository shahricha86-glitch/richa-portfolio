<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected Case Study — Richa Kandoi</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>
  <link rel="stylesheet" href="styles.css?v=2" />
  <style>
    /* Custom styling specific for the password gate */
    .password-container {
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }
    .password-input-wrapper {
      position: relative;
      width: 100%;
      margin-top: 16px;
      margin-bottom: 16px;
    }
    /* password-input inherits all border/focus styles from .form-input in styles.css */
    .password-input {
      padding-right: 48px; /* extra room for the eye toggle icon */
    }
    /* Override Chrome's blue autofill highlight */
    .password-input:-webkit-autofill,
    .password-input:-webkit-autofill:hover,
    .password-input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px var(--color-canvas) inset;
      -webkit-text-fill-color: var(--color-ink);
      transition: background-color 5000s ease-in-out 0s;
    }
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-ink-subtle);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color .2s var(--ease-pointer);
    }
    .password-toggle:hover {
      color: var(--color-ink);
    }
    .password-submit {
      width: 100%;
      padding: 16px;
      font-family: var(--font-interface);
      font-size: 16px;
      font-weight: 500;
      color: var(--color-ink);
      background: var(--color-highlight);
      border: none;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform var(--duration-instant);
    }
    .password-submit:hover {
      transform: scale(1.02);
    }
    .password-submit:hover i {
      animation: cursorBowShoot 1.4s ease-in-out infinite;
    }
    @media (max-width: 768px) {
      .password-gate-main {
        padding-left: var(--gutter-mobile) !important;
        padding-right: var(--gutter-mobile) !important;
      }
      .password-container {
        max-width: 100%;
      }
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T0KZ8VMDX6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T0KZ8VMDX6');
  </script>
</head>
<body>

<div id="cursor" aria-hidden="true">
  <span class="cursor__text">Unlock <i class="ph ph-lock-key cursor__icon"></i></span>
</div>

<div class="page" style="min-height: 100vh; display: flex; flex-direction: column;">

<div class="edge edge--left"></div>
<div class="edge edge--right"></div>

<!-- ── Nav ────────────────────────────────────── -->
<nav class="nav-global">
  <div class="nav__inner">
    <a href="index.html" class="nav__brand">Richa Kandoi</a>
    <ul class="nav__links">
      <li><a href="index.html#work">Work</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <a href="lets-talk.html" class="nav__cta">Let's Talk</a>
  </div>
</nav>

<!-- ── Password Gate Content ────────────────────── -->
<main class="password-gate-main" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: var(--nav-height) var(--gutter) 40px;">

  <div class="password-container">
    <i class="ph-light ph-lock-key" style="font-size: 48px; color: var(--color-ink); display: inline-block; margin-bottom: 48px;"></i>
    <h1 class="card__headline" style="margin-bottom: 12px;">Protected Case Study</h1>
    <p style="font-family: var(--font-interface); font-size: 16px; line-height: 1.6; color: var(--color-ink-subtle); margin-bottom: 40px;">This case study contains sensitive information.<br>Please enter the password to view.</p>

    <form action="#" method="POST" style="text-align: left;">
      <div class="password-input-wrapper">
        <input type="password" id="passInput" class="form-input password-input" placeholder="Enter password..." required />
        <button type="button" id="togglePass" class="password-toggle" title="Toggle password visibility">
          <i class="ph ph-eye-slash" style="font-size: 20px;"></i>
        </button>
      </div>
      <button type="submit" class="password-submit">Unlock Case Study <i class="ph ph-arrow-up-right" style="font-size: 1.1em;"></i></button>
    </form>

    <p style="margin-top: 24px; font-family: var(--font-interface); font-size: 14px; color: var(--color-ink-subtle);">
      Don't have the password? <a href="mailto:richashah.kandoi@gmail.com" style="color: var(--color-ink); text-decoration: underline;">Request Access</a>
    </p>
  </div>

</main>

<!-- We generally omit the heavy footer on password pages to reduce distraction, but we keep the global nav so the user isn't trapped. -->

</div><!-- /page -->

<script src="main.js"></script>
<script>
  (function() {
    const btn = document.querySelector('.password-submit');
    const customCursor = document.getElementById('cursor');
    if (btn && customCursor) {
      btn.addEventListener('mouseenter', () => { customCursor.style.opacity = '0'; });
      btn.addEventListener('mouseleave', () => { customCursor.style.opacity = '1'; });
    }

    const passInput = document.getElementById('passInput');
    const togglePass = document.getElementById('togglePass');
    if (passInput && togglePass) {
      const toggleIcon = togglePass.querySelector('i');
      togglePass.addEventListener('click', () => {
        if (passInput.type === 'password') {
          passInput.type = 'text';
          toggleIcon.classList.replace('ph-eye-slash', 'ph-eye');
        } else {
          passInput.type = 'password';
          toggleIcon.classList.replace('ph-eye', 'ph-eye-slash');
        }
      });
    }

    const form = document.querySelector('form');
    const submitBtn = document.querySelector('.password-submit');
    if (form && passInput) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (submitBtn) submitBtn.disabled = true;

        fetch('/api/unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passInput.value })
        })
        .then(function(res) {
          if (res.ok) {
            const params = new URLSearchParams(window.location.search);
            const dest = params.get('to') || 'abule-adminportal';
            window.location.href = dest;
          } else {
            passInput.classList.add('input--error');
            passInput.style.outlineColor = 'red';
            passInput.value = '';
            passInput.placeholder = 'Incorrect password — try again';
            if (submitBtn) submitBtn.disabled = false;
            setTimeout(function() {
              passInput.style.outlineColor = '';
              passInput.placeholder = 'Enter password...';
            }, 2200);
          }
        })
        .catch(function() {
          passInput.placeholder = 'Something went wrong — try again';
          if (submitBtn) submitBtn.disabled = false;
        });
      });
    }
  })();
</script>

</body>
</html>
