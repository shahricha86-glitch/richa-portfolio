<!-- ── Contact Page ──────────────────────────── -->
<div class="contact-page">

  <h1 class="contact-page__heading">
    <span class="sans">Feel free to </span><span class="serif">reach out.</span>
  </h1>

  <div class="contact-wrap">

    <!-- ── Left column — contact info ── -->
    <div class="contact-col-left">

      <div class="contact-item">
        <i class="ph ph-linkedin-logo contact-item__icon"></i>
        <div class="contact-item__title">LinkedIn</div>
        <div class="contact-item__body">
          <a href="https://www.linkedin.com/in/richa-kandoi/" target="_blank" rel="noopener noreferrer" class="contact-item__link">richa-kandoi</a>
        </div>
      </div>

      <div class="contact-item">
        <i class="ph ph-envelope contact-item__icon"></i>
        <div class="contact-item__title">Email</div>
        <div class="contact-item__body">
          <a href="mailto:richashah.kandoi@gmail.com" class="contact-item__link">richashah.kandoi@gmail.com</a>
          <button class="contact-copy-btn" aria-label="Copy email" onclick="navigator.clipboard.writeText('richashah.kandoi@gmail.com'); this.innerHTML='<i class=\'ph ph-check\'></i>'; setTimeout(() => { this.innerHTML='<i class=\'ph ph-copy\'></i>'; }, 2000);">
            <i class="ph ph-copy"></i>
          </button>
        </div>
      </div>

      <div class="contact-item">
        <i class="ph ph-phone contact-item__icon"></i>
        <div class="contact-item__title">Phone</div>
        <div class="contact-item__body">
          <a href="tel:+19296298813" class="contact-item__link">+1 (929) 629-8813</a>
        </div>
      </div>

    </div>

    <!-- ── Right column — form ── -->
    <div class="contact-col-right">
      <form class="contact-form" action="https://formspree.io/f/xdabzayk" method="POST">

        <div class="form-group">
          <label class="form-label" for="name">Name*</label>
          <input class="form-input" type="text" id="name" name="name" placeholder="Your Name" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email*</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="hello@site.com" autocomplete="email" required />
        </div>

        <div class="form-group form-group--message">
          <label class="form-label" for="message">Message*</label>
          <textarea class="form-input" id="message" name="message" placeholder="Message..." required></textarea>
        </div>

        <button type="submit" class="contact-submit">Submit</button>

      </form>
    </div>

  </div>
</div>
